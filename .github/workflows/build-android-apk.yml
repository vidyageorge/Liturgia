# Build Liturgia APK in the cloud (no Android Studio on your PC).
# Download the APK from Actions -> latest run -> Artifacts.
#
# Use "Run workflow" on the latest commit (not "Re-run failed jobs" on an old run).
#
# Optional repo secret VITE_API_URL (default: Render production API).

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/build-android-apk.yml'
      - 'scripts/build-android-apk.ps1'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Java 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Pin Java 21 for build
        run: |
          echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> "$GITHUB_ENV"
          java -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build web client for Android
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://liturgia-24z1.onrender.com/api' }}
          VITE_CAPACITOR_BUILD: 'true'
        run: npm run build:android

      - name: Add Android platform if missing
        working-directory: client
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: client/android
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          java -version
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home="${JAVA_HOME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liturgia-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
