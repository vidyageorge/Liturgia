<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liturgia | St. Mathias English Community</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }
      .app-boot-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Montserrat, system-ui, sans-serif;
        color: #6b5b4f;
        background: #fdf8f0;
        text-align: center;
        gap: 1rem;
      }
      .app-boot-logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 4px 16px rgba(61, 41, 20, 0.15);
      }
      .app-boot-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: #3d2914;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0;
      }
      .app-boot-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e8d5a3;
        border-top-color: #c9a227;
        border-radius: 50%;
        animation: app-boot-spin 1s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loading">
        <img class="app-boot-logo" src="./logo.png" alt="" />
        <p class="app-boot-title">Liturgia</p>
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <p>Loading Liturgia...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
