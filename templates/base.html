<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Liturgia{% endblock %} | St. Mathias English Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-gold: #C9A227;
            --primary-burgundy: #722F37;
            --primary-cream: #FDF8F0;
            --dark-wood: #3D2914;
            --deep-purple: #4A1942;
            --sacred-blue: #1E3A5F;
            --light-gold: #E8D5A3;
            --soft-white: #FEFDFB;
            --text-dark: #2C1810;
            --text-muted: #6B5B4F;
            --shadow-soft: 0 4px 20px rgba(61, 41, 20, 0.1);
            --shadow-medium: 0 8px 30px rgba(61, 41, 20, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--primary-cream);
            color: var(--text-dark);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Decorative Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(201, 162, 39, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(114, 47, 55, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(30, 58, 95, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .main-header {
            background: linear-gradient(135deg, var(--dark-wood) 0%, var(--primary-burgundy) 50%, var(--deep-purple) 100%);
            padding: 0;
            box-shadow: var(--shadow-medium);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-top {
            text-align: center;
            padding: 1.5rem 2rem 1rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(201, 162, 39, 0.3);
        }

        .community-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--light-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .app-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        /* Navigation */
        .main-nav {
            display: flex;
            justify-content: center;
            padding: 0;
        }

        .nav-list {
            display: flex;
            list-style: none;
            gap: 0;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: var(--transition);
            border-bottom: 3px solid transparent;
        }

        .nav-item a:hover,
        .nav-item a.active {
            color: var(--light-gold);
            background: rgba(201, 162, 39, 0.1);
            border-bottom-color: var(--primary-gold);
        }

        .nav-item a i {
            font-size: 1rem;
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Page Title */
        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--dark-wood);
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Cards */
        .card {
            background: var(--soft-white);
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-medium);
            transform: translateY(-2px);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-burgundy) 0%, var(--deep-purple) 100%);
            color: white;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .card-body {
            padding: 1.5rem;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-gold) 0%, #D4AF37 100%);
            color: var(--dark-wood);
            box-shadow: 0 4px 15px rgba(201, 162, 39, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 162, 39, 0.4);
        }

        .btn-secondary {
            background: var(--sacred-blue);
            color: white;
        }

        .btn-secondary:hover {
            background: #264B75;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-burgundy);
            color: var(--primary-burgundy);
        }

        .btn-outline:hover {
            background: var(--primary-burgundy);
            color: white;
        }

        .btn-danger {
            background: #DC3545;
            color: white;
        }

        .btn-danger:hover {
            background: #BB2D3B;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #E0D6C8;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
            background: white;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th,
        .table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #E0D6C8;
        }

        .table th {
            background: #F5EFE6;
            font-weight: 600;
            color: var(--dark-wood);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table tr:hover {
            background: #FAF7F2;
        }

        /* Grid */
        .grid {
            display: grid;
            gap: 1.5rem;
        }

        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .grid-3 {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .grid-4 {
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        /* Stats Cards */
        .stat-card {
            background: var(--soft-white);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-medium);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .stat-icon.gold {
            background: linear-gradient(135deg, var(--primary-gold) 0%, #D4AF37 100%);
        }

        .stat-icon.burgundy {
            background: linear-gradient(135deg, var(--primary-burgundy) 0%, #8B3A44 100%);
        }

        .stat-icon.blue {
            background: linear-gradient(135deg, var(--sacred-blue) 0%, #2A4A6B 100%);
        }

        .stat-icon.purple {
            background: linear-gradient(135deg, var(--deep-purple) 0%, #5C2254 100%);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark-wood);
            line-height: 1;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-gold {
            background: rgba(201, 162, 39, 0.15);
            color: #9A7B1C;
        }

        .badge-burgundy {
            background: rgba(114, 47, 55, 0.15);
            color: var(--primary-burgundy);
        }

        .badge-blue {
            background: rgba(30, 58, 95, 0.15);
            color: var(--sacred-blue);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--soft-white);
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: var(--transition);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-burgundy) 0%, var(--deep-purple) 100%);
            color: white;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.8;
            transition: var(--transition);
        }

        .modal-close:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid #E0D6C8;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        /* Alerts */
        .alert {
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-success {
            background: #D4EDDA;
            color: #155724;
            border: 1px solid #C3E6CB;
        }

        .alert-error {
            background: #F8D7DA;
            color: #721C24;
            border: 1px solid #F5C6CB;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .community-name {
                font-size: 1.5rem;
                letter-spacing: 1px;
            }

            .nav-list {
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-item a {
                padding: 0.75rem 1rem;
                font-size: 0.75rem;
            }

            .main-content {
                padding: 1rem;
            }

            .page-title {
                font-size: 1.8rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Cross decoration */
        .cross-icon {
            color: var(--primary-gold);
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <header class="main-header">
        <div class="header-top">
            <h1 class="community-name">
                <i class="fas fa-cross cross-icon"></i>
                St. Mathias English Community
            </h1>
            <p class="app-name">Liturgia</p>
        </div>
        <nav class="main-nav">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="/" class="{% if request.path == '/' %}active{% endif %}">
                        <i class="fas fa-home"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/schedule" class="{% if request.path == '/schedule' %}active{% endif %}">
                        <i class="fas fa-calendar-alt"></i>
                        Schedule
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/masses" class="{% if request.path == '/masses' %}active{% endif %}">
                        <i class="fas fa-history"></i>
                        Mass History
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/members" class="{% if request.path == '/members' %}active{% endif %}">
                        <i class="fas fa-users"></i>
                        Members
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/community" class="{% if request.path == '/community' %}active{% endif %}">
                        <i class="fas fa-hands-praying"></i>
                        Community
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/changelog" class="{% if request.path == '/changelog' %}active{% endif %}">
                        <i class="fas fa-clipboard-list"></i>
                        Change Log
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Utility functions
        async function api(endpoint, options = {}) {
            const response = await fetch(`/api${endpoint}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });
            return response.json();
        }

        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function hideModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-IN', { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        function formatRole(role) {
            return role.split('_').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
